plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notenative'
version = '0.1.0'

android {
  namespace "expo.modules.notenative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  // NewPipe Extractor -- GPL-3.0-or-later, (c) Team NewPipe.
  // Consumed as an unmodified binary dependency. See THIRD_PARTY_NOTICES.md.
  implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'

  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
